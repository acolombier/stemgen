[package]
name = "stemgen-cli"
version = "0.5.0"
edition = "2024"


[[bin]]
name = "stemgen"
path = "src/main.rs"
doc = false

[dependencies]
clap = {version="4.5.46", features = ["cargo", "derive"]}
glob = "0.3.3"
indicatif = "0.18.0"

[dependencies.ffmpeg-next]
version = "7.1.0"
default-features = false
features = ["codec","format", "software-resampling", "build"]

[dependencies.stemgen]
path = ".."

[features]
default = []
cuda = ["stemgen/cuda"]
